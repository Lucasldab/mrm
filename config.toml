viewer = "rv"

[sources.mangadex]
base_url = "https://api.mangadex.org"
enabled = true

[sources.mangack]
base_url = "https://mangack.com"
enabled = true

[sources.asura]
base_url = "https://asurascans.com"
enabled = true

[notifications]
enabled = true
poll_interval_minutes = 30

[db]
# File containing the Postgres URL, e.g. postgres://mrm:PASSWORD@host:5433/mrm
# Keep it chmod 600 and out of git. MRM_DATABASE_URL overrides this.
url_file = "~/.config/mrm/db_url"

[rv]
scroll_speed = 80
fast_scroll_speed = 600
fullscreen = true

[rv.binds]
e = "scroll_down"
u = "scroll_up"
q = "quit"
