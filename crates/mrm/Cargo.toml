[package]
name    = "mrm"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "mrm"
path = "src/main.rs"

[features]
# Default install: desktop notifications only (notify-rust / D-Bus).
default = []

# Optional push-notification dispatch to ntfy.sh (or a self-hosted ntfy
# server). Adds a remote HTTP POST to the existing desktop notification
# path; pairs with the `[notifications.ntfy]` block in config.toml.
# Build with: `cargo build --release --features ntfy`.
ntfy = []

[dependencies]
anyhow     = "1"
chrono     = { version = "0.4", features = ["clock"] }
crossterm  = { version = "0.29", features = ["event-stream"] }
futures    = "0.3"
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui    = "0.30"
async-trait = "0.1"
toml        = "1"
reqwest     = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "query"] }
# Cloudflare-fronted scrapers need TLS fingerprint impersonation. rquest
# emulates Chrome/Firefox/Safari at the BoringSSL layer so requests look
# like a real browser. Used only by the Asura scraper.
rquest      = "5"
rquest-util = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx       = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "migrate"] }
tokio      = { version = "1", features = ["full"] }
scraper    = "0.22"
notify-rust = { version = "4", features = ["z"] }
regex      = "1"
tempfile   = "3"
tracing    = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
ratatui-image = { version = "10", features = ["crossterm"] }
